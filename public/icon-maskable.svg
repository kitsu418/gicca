<!-- Maskable icon: subject is contained within the inner 80% "safe zone"
     so OS-imposed circular/rounded-rectangle masks don't crop it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(140 188)">
    <rect width="232" height="148" rx="14" fill="none" stroke="#ffffff" stroke-width="12"/>
    <rect y="28" width="232" height="28" fill="#ffffff"/>
    <rect x="28" y="80" width="80" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
    <rect x="28" y="98" width="56" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
    <circle cx="180" cy="102" r="16" fill="#ffffff"/>
    <circle cx="180" cy="102" r="7" fill="#0ea5e9"/>
  </g>
</svg>
